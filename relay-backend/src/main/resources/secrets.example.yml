# Copy this file to secrets.yml (same folder) and fill in your real values.
# secrets.yml is git-ignored; never commit it or share it in screenshots.
spring:
  datasource:
    password: "your-postgres-password"

app:
  jwt:
    # 32+ random characters. Generate one in PowerShell with:
    #   $b = New-Object byte[] 48; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
    secret: "paste-the-generated-value-here"
  gemini:
    api-key: "your-gemini-api-key"
